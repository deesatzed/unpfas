[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pfas-rpa1163-defluor-bench"
version = "0.1.0"
description = "Structure- and physics-guided triage benchmark for RPA1163 enzymatic defluorination across MFA, DFA, and PFBA"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "gemmi>=0.6.5",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "openff-forcefields>=2024.04",
    "openff-interchange>=0.3.25",
    "openff-nagl>=0.4.0",
    "openff-nagl-models>=0.2.0",
    "openff-toolkit>=0.16.0",
    "openff-units>=0.2.2",
    "openmm>=8.1",
    "pandas>=2.1",
    "pdbfixer>=1.9",
    "pyyaml>=6.0",
    "rdkit>=2023.9",
    "seaborn>=0.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pfas-bench = "pfas_bench.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pfas_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]
